# syntax=docker/runtime-kit:3
schemaVersion: "3"
kind: mixin
displayName: Browser Use for Codex
description: Adds a headless Chromium browser controlled through Playwright MCP
sourceUrl: https://github.com/dvdksn/browser-kit
version: "3.0.1"
provides: [browser-use-codex]
requires: [codex]
dockerfile: spec.dockerfile

capabilities:
  - type: com.docker.runtime/lifecycle@1
    config:
      install:
        - command: |
            set -eu
            if [ ! -x /usr/local/bin/browser-use-mcp ]; then
              echo "Browser kit image content is missing. Use a v3 workload and v3 mixins; for a v2 sandbox, use ghcr.io/dvdksn/browser-kit:codex instead." >&2
              exit 1
            fi
            /usr/local/bin/browser-use-mcp --version
            codex mcp remove browser-use >/dev/null 2>&1 || true
            codex mcp add browser-use --env PLAYWRIGHT_BROWSERS_PATH=/opt/ms-playwright -- /usr/local/bin/browser-use-mcp
          user: "1000"
          description: Register the browser-use MCP server with Codex
  - type: com.docker.runtime/agent-context@1
    config:
      contentFile: ./agent-context.md
